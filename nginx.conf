server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass https://api.pionex.com/;
        proxy_set_header Host api.pionex.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Pass through Pionex headers
        proxy_set_header PIONEX-KEY $http_pionex_key;
        proxy_set_header PIONEX-SIGNATURE $http_pionex_signature;
        proxy_set_header Content-Type $http_content_type;
        
        # CORS headers
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Headers "PIONEX-KEY,PIONEX-SIGNATURE,Content-Type";
        add_header Access-Control-Allow-Methods "GET,POST,DELETE,OPTIONS";
        
        # Handle OPTIONS requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Headers "PIONEX-KEY,PIONEX-SIGNATURE,Content-Type";
            add_header Access-Control-Allow-Methods "GET,POST,DELETE,OPTIONS";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    location /diag {
        proxy_pass https://api.pionex.com/api/v1/market/bookTickers?symbol=BTC_USDT_PERP;
        proxy_set_header Host api.pionex.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}